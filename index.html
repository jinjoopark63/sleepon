<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F2A">
<title>SLEEP:ON 스르르</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column. Night screens stay deep navy with a moon-amber key colour;
     the morning check turns the same components to a dawn palette. The night line (sound level
     drawn across the night) is the one loud element; everything around it stays quiet. */
  --night-0:#0A0F2A; --night-1:#141A44; --night-2:#222A66; --line:#2F3880;
  --ink:#E9ECFF; --mute:#9BA4D8; --moon:#FFD88A; --glow:#8EA0FF;
  --dawn-0:#FFF4E3; --dawn-1:#FFD9BC; --dawn-ink:#3A2440; --dawn-mute:#7A5C6E;
  --display:'Hahmlet','Nanum Myeongjo','AppleMyungjo','Noto Serif CJK KR',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#060920;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--moon);outline-offset:2px;border-radius:6px}

.app{--fg:var(--ink);--sub:var(--mute);--card:rgba(255,255,255,.06);--edge:rgba(142,160,255,.3);
  --key:var(--moon);--key-ink:#2A2140;--pick:rgba(142,160,255,.24);
  max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;color:var(--fg);
  background:linear-gradient(180deg,var(--night-0) 0%,var(--night-1) 55%,var(--night-2) 100%)}
.app[data-tone="dawn"]{--fg:var(--dawn-ink);--sub:var(--dawn-mute);--card:rgba(255,255,255,.62);
  --edge:rgba(58,36,64,.2);--key:var(--dawn-ink);--key-ink:var(--dawn-0);--pick:rgba(58,36,64,.14);
  background:linear-gradient(180deg,var(--dawn-0) 0%,var(--dawn-1) 100%)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 6px}
.mark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.07em;text-decoration:none}
.mark span{color:var(--key)}
.tagline{font-size:12.5px;color:var(--sub)}
main{flex:1;overflow-y:auto;padding:10px 20px 28px;display:flex;flex-direction:column;gap:18px}
main > *{flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:rgba(10,15,42,.92)}
.tabs a{padding:12px 0 14px;text-align:center;font-size:13.5px;color:var(--mute);text-decoration:none}
.tabs a[aria-current="page"]{color:var(--moon);font-weight:600}
.app[data-view="sleep"] .tabs,.app[data-view="sleep"] .top{display:none}
.app[data-tone="dawn"] .tabs{display:none}
.app[data-view="check"] .tabs,.app[data-view="check"] .top,.app[data-view="morning"] .top{display:none}

h1{font-family:var(--display);font-weight:500;font-size:clamp(29px,8.4vw,37px);line-height:1.28;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.35;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--sub)}
p.lead{color:var(--sub);font-size:15.5px;max-width:34em}
.small{font-size:13px;color:var(--sub)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}

.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:14px;
  font-weight:600;font-size:16px;background:var(--key);color:var(--key-ink);width:100%;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:6px}

.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .big{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.35}
.card .why{font-size:14px;color:var(--sub)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--key);color:var(--key);align-self:flex-start}

.steps{list-style:none;display:grid;gap:0;border-top:1px solid var(--edge)}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:6px;padding:11px 0;border-bottom:1px solid var(--edge)}
.steps b{font-family:var(--display);font-weight:300;font-size:22px;line-height:1.2;color:var(--key)}
.steps strong{display:block;font-weight:600;font-size:15.5px}
.steps span{font-size:13.5px;color:var(--sub)}

fieldset{border:0;display:flex;flex-direction:column;gap:8px}
legend,.lab{font-size:14.5px;font-weight:600;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.five{grid-template-columns:repeat(5,1fr)} .seg.six{grid-template-columns:repeat(3,1fr)} .seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--edge);background:var(--card);font-size:14.5px;padding:4px 6px;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--key);color:var(--key-ink);border-color:var(--key);font-weight:600}
.seg button small{display:block;font-size:11.5px;opacity:.8}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times label{display:flex;flex-direction:column;gap:6px;font-size:14.5px;font-weight:600}
input[type="time"]{min-height:48px;border-radius:12px;border:1px solid var(--edge);background:var(--card);padding:0 12px;
  font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;width:100%}
input[type="range"]{width:100%;accent-color:var(--moon)}
.mix{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px}

.plan{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.plan div{display:flex;flex-direction:column}
.plan .t{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.plan .arrow{color:var(--sub);padding-bottom:10px}
.acts{list-style:none;display:flex;flex-direction:column;gap:10px}
.acts li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.acts li::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--key);margin-top:8px}
.acts strong{font-weight:600} .acts span{display:block;font-size:13.5px;color:var(--sub)}

/* 10초 체크: one question per screen */
.qwrap{flex:1;display:flex;flex-direction:column;gap:24px;padding-top:8px}
.qbar{display:flex;align-items:center;gap:12px}
.qbar .back{width:44px;height:44px;margin-left:-10px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.bars{flex:1;display:grid;gap:6px}
.bars i{height:4px;border-radius:2px;background:var(--edge)} .bars i.on{background:var(--key)}
.qcount{font-size:13px;color:var(--sub);min-width:32px;text-align:right}
.q{display:flex;flex-direction:column;gap:8px} .q h2{font-size:27px;line-height:1.32}
.opts,.tcards{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;border:1px solid var(--edge);background:var(--card)}
.opt strong{display:block;font-size:17px;font-weight:600;margin-bottom:2px} .opt span{font-size:13.5px;color:var(--sub);line-height:1.4}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge);flex:none;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"]{border:2px solid var(--key);background:var(--pick);padding:17px}
.opt[aria-pressed="true"] .dot{background:var(--key);border-color:var(--key)}
.opt[aria-pressed="true"] .dot::after{content:'';width:9px;height:5px;margin-top:-2px;border-left:2.5px solid var(--key-ink);border-bottom:2.5px solid var(--key-ink);transform:rotate(-45deg)}
.tcard{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;border:1px solid var(--edge);background:var(--card)}
.tcard .ic{width:44px;height:44px;border-radius:12px;background:var(--pick);display:flex;align-items:center;justify-content:center;flex:none}
.tcard label{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--sub);font-weight:500}
.tcard input[type="time"]{border:0;background:transparent;padding:0;min-height:38px;font-size:25px;color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 button{min-height:64px;border-radius:16px;border:1px solid var(--edge);background:var(--card);font-size:17px}
.grid2 button[aria-pressed="true"]{border:2px solid var(--key);background:var(--pick);font-weight:600}
.opts.tight{gap:8px} .opts.tight .opt{padding:13px 16px} .opts.tight .opt[aria-pressed="true"]{padding:12px 15px}
.actq{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;border:1px solid var(--edge);background:var(--card)}
.actq strong{font-size:16px;font-weight:600}
.hello{font-size:13px;color:var(--sub);white-space:nowrap}
.qfoot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:8px}

/* sleep screen */
.sleep{display:flex;flex-direction:column;gap:14px;flex:1;padding-top:26px}
.pill{font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;background:rgba(142,160,255,.18);border:1px solid var(--edge)}
.pill.on{background:rgba(255,216,138,.16);border-color:var(--moon);color:var(--moon)}
.mode{font-size:12.5px;color:var(--sub)}
.clock{font-family:var(--display);font-weight:300;font-size:clamp(72px,24vw,104px);line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;text-align:center;margin-top:8px}
.note{text-align:center;color:var(--sub);font-size:14.5px;min-height:2.9em}
.trace{border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:8px 0 6px}
.trace canvas{display:block;width:100%;height:150px}
.trace figcaption{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:-6px}
.k1{background:var(--glow)} .k2{background:var(--moon)} .ax{margin-left:auto}
.log{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13.5px;min-height:92px}
.log li{display:grid;grid-template-columns:20px 46px 1fr;gap:6px;color:var(--sub)}
.log li:last-child{color:var(--fg)}
.log i{font-style:normal;font-size:11px;width:17px;height:17px;border-radius:50%;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;margin-top:2px}
.log time{font-variant-numeric:tabular-nums}
.log.all{min-height:auto;gap:8px;font-size:14px} .log.all li{color:var(--fg)}
.chart figcaption{font-size:12px;color:var(--sub);margin-top:4px}
details summary{cursor:pointer;font-size:14.5px;font-weight:600}
.ctl{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.vol{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;font-size:13px;color:var(--sub)}
.sleep.dim > *:not(.clock){opacity:.12;transition:opacity .6s}
.sleep.dim .clock{opacity:.35;transition:opacity .6s}

/* records */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .n{font-family:var(--display);font-weight:300;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.sum .n small{font-size:16px;font-family:var(--body)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);fill:var(--mute);font-size:11px}
.chart .v{fill:var(--ink);font-size:11.5px;font-weight:600}
.banner{font-size:13.5px;border:1px dashed var(--moon);color:var(--moon);border-radius:12px;padding:9px 12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--edge);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.adj{list-style:none;display:flex;flex-direction:column;gap:10px}
.adj li{padding-left:16px;border-left:3px solid var(--key);font-size:15px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#fff;color:#1F2A44;font-size:14px;
  padding:10px 16px;border-radius:12px;max-width:min(380px,90vw);box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-view="home" data-tone="night">
  <header class="top"><a class="mark" href="#tonight">SLEEP<span>:</span>ON</a><span class="tagline">스르르 · 웹 MVP</span></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="주요 화면">
    <a href="#tonight" data-tab="tonight">오늘 밤</a><a href="#records" data-tab="records">기록</a><a href="#about" data-tab="about">안내</a>
  </nav>
</div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app'), view = $('#view');
const KEY = 'sleepon.mvp.v1';
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const rel = t => (toMin(t) - 720 + 1440) % 1440;              // minutes since noon, so a night does not wrap
const unrel = m => fromMin(m + 720);
const dayStr = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const round5 = v => Math.round(v / 5) * 5;
const hm = m => (m >= 60 ? Math.floor(m / 60) + '시간 ' : '') + (m % 60 ? (m % 60) + '분' : (m >= 60 ? '' : '0분'));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------------------------------------------------------- content */
const SOUND = { rain: '빗소리', wave: '파도', brown: '브라운 노이즈', pink: '핑크 노이즈', wind: '바람', ambient: '느린 앰비언트' };
const COMBO = {
  'ambient+rain': { layers: { ambient: .8, rain: .55 }, why: '긴장이 높은 날에 맞춘 조합입니다. 1분에 60박인 느린 화음 아래에 빗소리를 얇게 깔았습니다.' },
  'rain+brown': { layers: { rain: .75, brown: .5 }, why: '평소 같은 날의 기본 조합입니다. 변화가 적은 빗소리를 낮은 소리로 받쳤습니다.' },
  'brown+wave': { layers: { brown: .7, wave: .6 }, why: '몸이 많이 피곤한 날에 맞춘 조합입니다. 자극이 적은 낮은 소리 위주입니다.' },
  'wave+wind': { layers: { wave: .75, wind: .45 }, why: '긴장도 피로도 낮은 날의 조합입니다. 느리게 오르내리는 파도와 바람입니다.' },
};
const comboName = id => id.split('+').map(k => SOUND[k]).join(' + ');
const ACTION = {
  note: ['내일 할 일 3줄 적고 덮기', '머릿속 목록을 메모로 옮겨 둡니다.'],
  breath: ['4초 들이쉬고 6초 내쉬기 5번', '누운 뒤 소리 박자에 맞춰 천천히 합니다.'],
  screen: ['눕기 30분 전 화면 내려놓기', '알림은 방해금지로 돌려 둡니다.'],
  light: ['방 조명 낮추기', '스탠드 하나만 남깁니다.'],
  stretch: ['목과 어깨 2분 풀기', '하루 동안 굳은 곳만 가볍게 풉니다.'],
  wash: ['따뜻한 물로 씻고 바로 눕기', '일정이 늦게 끝난 날의 짧은 마무리입니다.'],
};
const LAT = [[8, '10분 안쪽'], [15, '15분'], [20, '20분'], [30, '30분'], [45, '45분'], [70, '1시간 넘게']];
const FRESH = ['전혀', '별로', '보통', '꽤', '아주'];
const LEVEL = ['낮음', '보통', '높음'];

/* ---------------------------------------------------------------- state (this browser only) */
let MEM = false;
const DEFAULT = { v: 1, baseline: null, sampleBaseline: 35, seeded: false, tonight: null, nights: [],
  settings: { fadeAfter: null, bedShift: 0, resleepMin: 10, volume: .8, wake: '07:00' } };
function seed(s) {
  const lat = [38, 33, 36, 27, 24, 21, 18], fr = [2, 2, 3, 3, 4, 4, 4], tn = [2, 1, 2, 1, 2, 1, 2];
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - (7 - i));
    s.nights.push({ date: dayStr(d), tension: tn[i], fatigue: 1, combo: tn[i] === 2 ? 'ambient+rain' : 'rain+brown',
      actions: ['screen', 'breath'], done: [i > 1, i > 3], bed: '23:50', wake: '07:00', latency: lat[i], fresh: fr[i], woke: i === 2, sample: true });
  }
  s.seeded = true;
}
function load() {
  let s = null;
  try { localStorage.setItem(KEY + '.t', '1'); localStorage.removeItem(KEY + '.t'); s = JSON.parse(localStorage.getItem(KEY) || 'null'); }
  catch (e) { MEM = true; }
  if (!s || s.v !== 1) s = JSON.parse(JSON.stringify(DEFAULT));
  s.settings = Object.assign({}, DEFAULT.settings, s.settings);
  if (!s.seeded) seed(s);
  return s;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { MEM = true; } }
const realNights = () => S.nights.filter(n => !n.sample && n.latency != null);
const sampleNights = () => S.nights.filter(n => n.sample && n.latency != null);

/* ---------------------------------------------------------------- routine rules (pure) */
function defaultCombo(c) {
  if (c.tension === 2) return 'ambient+rain';
  if (c.fatigue === 2 && c.tension === 0) return 'brown+wave';
  if (c.tension === 0) return 'wave+wind';
  return 'rain+brown';
}
function buildRoutine(c, hist, opt) {
  // sound: start from the rule, switch to a combination that put this person to sleep faster on similar nights
  let combo = defaultCombo(c), why = COMBO[combo].why, learned = false;
  const by = {};
  hist.filter(n => n.tension === c.tension).forEach(n => { (by[n.combo] = by[n.combo] || []).push(n.latency); });
  let best = null;
  for (const k in by) if (by[k].length >= 2 && COMBO[k]) { const a = avg(by[k]); if (!best || a < best.a) best = { k, a, n: by[k].length }; }
  const defAvg = by[combo] ? avg(by[combo]) : null;
  if (best && best.k !== combo && (defAvg === null || defAvg - best.a >= 5)) {
    combo = best.k; learned = true;
    why = `긴장도가 같았던 지난 ${best.n}번의 밤에 이 조합으로 평균 ${Math.round(best.a)}분 만에 잠들었습니다.`;
  }
  // time: 7시간 30분 of sleep plus the time it usually takes to fall asleep, never earlier than 60분 after the day ends
  const recent = hist.slice(-3).map(n => n.latency);
  const lat = clamp(Math.round(recent.length ? avg(recent) : (opt.baseline || 20)), 10, 45);
  const endR = rel(c.end); let wakeR = rel(c.wake); if (wakeR <= endR) wakeR += 1440;
  const ideal = wakeR - 450 - lat - (opt.bedShift || 0), earliest = endR + 60;
  const bedR = Math.max(ideal, earliest), late = bedR > ideal + 5;

/* ---------------------------------------------------------------- the night */
const PH = {
  awake: ['깨어 있음 · 소리 재생 중', 0], fading: ['잠듦 추정 · 소리 줄이는 중', 0], silent: ['무음 유지', 0],

function logEv(label, text) { const K = sess.keys; if (K && K.length > 1) sess.p = clamp((simClock() - K[0][1]) / (K[K.length - 1][1] - K[0][1]), 0, 1); sess.log.push({ x: sess.p, label, text }); const ol = $('#log'); if (ol) ol.innerHTML = sess.log.slice(-4).map(e => `<li><i>${sess.log.indexOf(e) + 1}</i><time>${e.label}</time><span>${esc(e.text)}</span></li>`).join(''); }

function startNight(mode) {

function runReal(r) {

}
function beginWake(text, rampSec) {

function runDemo(r) {

  ev.forEach((e, i) => { const at = T, R = CRESP[e.key]; sess.keys.push([at, e.m]);
    later(at, () => {

      if (i === 0) Sound.ramp(1, 2); else { Sound.ramp(R.lv, e.key === 'awake' ? 1.5 : 3.5); Sound.tempo(48); }

function cmpChart(c) {

  const area = (pts, y0, h, col) => { const p = pts.map(([x, y]) => `${X(Math.min(x, c.xmax)).toFixed(1)},${(y0 + h - h * y).toFixed(1)}`).join(' ');
    return `<polygon points="${X(0)},${y0 + h} ${p} ${X(c.xmax)},${y0 + h}" fill="${col}" fill-opacity=".25"/><polyline points="${p}" fill="none" stroke="${col}" stroke-width="2.4"/>`; };

  g += `<line x1="${X(c.on)}" x2="${X(c.on)}" y1="4" y2="134" stroke="#E9ECFF" stroke-dasharray="3 3" opacity=".6"/><text x="${X(c.on) + 3}" y="44" class="v">잠듦 ${c.onLabel || c.on + '분'}</text>`;

  if (t.id === 'vol') { S.settings.volume = t.value / 100; Sound.volume(S.settings.volume); save(); }
  else if (t.dataset.layer && S.tonight) { S.tonight.routine.layers[t.dataset.layer] = t.value / 100; if (previewing) Sound.setLayer(t.dataset.layer, t.value / 100); save(); }
  else if (t.id === 'endTime' && C) C.end = t.value; else if (t.id === 'wakeTime' && C) C.wake = t.value;
});
document.addEventListener('visibilitychange', () => { if (sess && !document.hidden) tick(); });
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sound.unlock(), { passive: true }));

window.sleeponPlan = () => ({ plan: watchPlan(WATCH), resp: RESP, watch: WATCH });   // read-only, used to draw the same result elsewhere
const h0 = location.hash.replace('#', '');
go(h0 === 'records' || h0 === 'about' || h0 === 'watch' ? h0 : 'home');
})();
